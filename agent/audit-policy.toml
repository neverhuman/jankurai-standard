minimum_score = 85
fail_on = ["critical", "high"]
advisory_on = ["medium", "low"]
standard_version = "0.9.0"
auditor_version = "1.6.0"
schema_version = "1.9.0"
paper_edition = "2026.05-ed8"
target_stack = "rust-ts-vite-react-postgres-bounded-python"

[history]
max_rows = 500
max_bytes = 1048576
dedupe = "consecutive-equivalent"
mirror_env = "JANKURAI_HISTORY_MIRROR"
mirror_required = false
mirror_max_rows = 5000

[caps]
no_root_agent_instructions = 75
no_one_command_setup_or_validation = 70
no_deterministic_fast_lane = 65
no_security_lane_on_high_risk_repo = 60
generated_contracts_or_public_api_drift_untested = 80
python_direct_product_truth_or_db_ownership = 72
no_secret_or_dependency_scanning_in_ci = 78
no_jankurai_audit_lane_in_ci = 82
non_optimal_product_language_found = 74
too_much_python_in_product_surface = 72
vibe_placeholders_in_product_code = 68
fallback_soup_in_product_code = 70
future_hostile_dead_language_in_product_code = 64
severe_duplication_in_product_code = 70
generated_zone_mutation_risk = 76
direct_db_access_from_wrong_layer = 66
missing_web_e2e_lane = 82
missing_rendered_ux_qa_lane = 84
prompt_injection_risk = 78
overbroad_agent_agency = 65
secret_like_content_detected = 60
false_green_test_risk = 76
destructive_migration_risk = 70
missing_rust_property_or_integration_tests = 82
no_agent_friendly_exception_pattern = 76
missing_agent_readable_docs = 80
streaming_runtime_drift = 78

[limits]
rust_file_hard = 350
typescript_component_hard = 280
python_ai_file_hard = 300
function_hard = 70
agent_instruction_hard = 180
design_doc_hard = 600

# This is a standard/documentation repository. The teaching corpus under
# docs/BAD_*.md and the large design-doc set are intentional negative examples
# and reference text used by the audit rubric, not product source. Transient
# build/output trees and the local fusion workspace are never tracked and must
# be excluded from product scans. See docs/exceptions.md for the override model.
[scan]
excluded_paths = [
  ".fusion",
  ".jankurai",
  "target",
  "dist",
  "build",
  "node_modules",
  "test-results",
  "docs/BAD_CI.md",
  "docs/BAD_COMMENTS.md",
  "docs/BAD_COPY.md",
  "docs/BAD_DOCKER.md",
  "docs/BAD_GIT.md",
  "docs/BAD_MIGRATION.md",
  "docs/BAD_PYTHON.md",
  "docs/BAD_RUST.md",
  "docs/BAD_SQL.md",
  "docs/BAD_TYPE.md",
  "docs/BAD_gittools.md",
  "docs/BAD_release.md",
]
extra_excluded_paths = ["docs/BAD_", "tips/"]

# A teaching-corpus scan exception for the intentional negative-example docs.
# These files are referenced by the audit rubric as bad-behavior fixtures and
# must stay committed; they are excluded from product scans, not deleted.
[[exception]]
rule = "HLT-*"
path = "docs/BAD_*.md"
classification = "corpus"
owner = "standard"
expires = "2026-12-31"
migration_path = "Keep as audit-rubric negative examples; excluded from product scans while the rubric references them."

[variety]
min_instance = 2

[canonical]
check_readme = true
check_ci = true
require_badge = false
require_quick_start = true
require_stack = true
require_agents_link = true

[precommit_gate]
blocking = false
