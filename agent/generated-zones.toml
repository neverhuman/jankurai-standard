# Generated zones for jankurai-standard.
# This is a documentation/standard repo. The only generated output tree present
# is target/, which holds the local jankurai self-audit working area. It is
# never hand-edited and is regenerated by the audit lane, not committed.

[[zone]]
path = "target/"
source = "jankurai self-audit working area"
command = "bash ops/ci/audit.sh"
read_only = true
write_policy = "generated_output"
