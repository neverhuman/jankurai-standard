schema_version = "1.0.0"

# Tool-adoption manifest for jankurai-standard.
# This is a documentation/standard repo, so the adopted tools are the ones that
# run against documents and the control-plane maps. Each tool whose mode is
# `auto` or `required` is executed by ops/ci/tool-adoption.sh in CI and its
# evidence artifact is uploaded by the workflow's upload-artifact step.

[[tools]]
id = "audit-ci"
mode = "auto"

[[tools]]
id = "proof-routing"
mode = "auto"

